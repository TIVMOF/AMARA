# Does amara-sew still build on this branch? Runs when a pull request touching
# this stage is opened, and again on each push to it. Builds only, never pushes:
# a pull request from a fork has a read-only token and could not publish anyway.
name: pull request sew

on:
  pull_request:
    # The default types - opened, synchronize, reopened - are deliberate.
    # 'opened' alone would check the first commit of a pull request and
    # nothing after it, which is the state least likely to be the one merged.
    paths:
      - 'sew/**'
      - '.github/workflows/pull-request-sew.yaml'
      - '.github/workflows/composite-actions/build-image.yaml'

permissions:
  contents: read

# A new push supersedes the run in flight for the same pull request.
concurrency:
  group: pr-sew-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/composite-actions/build-image.yaml
    with:
      component: sew
