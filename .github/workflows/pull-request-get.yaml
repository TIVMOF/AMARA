name: pull request get

on:
  pull_request:
    paths:
      - 'get/**'
      - '.github/workflows/pull-request-get.yaml'
      - '.github/actions/build-image/action.yml'

permissions:
  contents: read

# A new push supersedes the run in flight for the same pull request.
concurrency:
  group: pr-get-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build amara-get
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-image
        with:
          component: get
