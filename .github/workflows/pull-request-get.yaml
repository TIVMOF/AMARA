# Does amara-get still build on this branch? Runs when a pull request touching
# this stage is opened, and again on each push to it. Builds only, never pushes:
# a pull request from a fork has a read-only token and could not publish anyway.
name: pull request get

on:
  pull_request:
    # The default types - opened, synchronize, reopened - are deliberate.
    # 'opened' alone would check the first commit of a pull request and
    # nothing after it, which is the state least likely to be the one merged.
    paths:
      - 'get/**'
      - '.github/workflows/pull-request-get.yaml'
      - '.github/actions/build-image/action.yml'

permissions:
  contents: read

# A new push supersedes the run in flight for the same pull request.
concurrency:
  group: pr-get-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build amara-get
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
        with:
          component: get
