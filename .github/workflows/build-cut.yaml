name: build cut

on:
  push:
    branches: [main]
    paths:
      - 'cut/**'
      - '.github/workflows/build-cut.yaml'
      - '.github/actions/build-image/action.yml'
  # So a build can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build amara-cut
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
        with:
          component: cut
