# Does amara-sew still build? Runs on every push to main that touches this
# stage. Builds only - publishing is release-sew.yaml, by hand.
name: build sew

on:
  push:
    branches: [main]
    paths:
      - 'sew/**'
      - '.github/workflows/build-sew.yaml'
      - '.github/actions/build-image/action.yml'
  # So a build can be re-run without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build amara-sew
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A local composite action cannot be read before its own repository is
      # on disk, so the checkout comes first.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-image
        with:
          component: sew
