# The build recipe, called by the six workflows that only check an image
# builds: build-{get,cut,sew}.yaml on main, and pull-request-{get,cut,sew}.yaml
# on a pull request. Nothing here pushes - publishing is release-image.yaml.
#
# It lives in one file so the recipe is changed in one place. The six callers
# differ only in which stage they name and what triggers them.
name: Build image

on:
  workflow_call:
    inputs:
      component:
        description: Which stage to build - get, cut or sew.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build amara-${{ inputs.component }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amara-${{ inputs.component }}
        uses: docker/build-push-action@v6
        with:
          # The build context is the stage's own directory, which is what
          # keeps the crawl data out of it: each stage has a .dockerignore
          # excluding data/ and .env.
          context: ./${{ inputs.component }}
          push: false
          # Loaded into the runner's daemon so the smoke test below can run it.
          load: true
          tags: amara-${{ inputs.component }}:ci
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}

      - name: Smoke test
        # A built image is not a working one. This catches the failure a build
        # cannot: an image whose entry point cannot import what it needs -
        # a missing COPY, a dependency left out of requirements.txt.
        run: docker run --rm amara-${{ inputs.component }}:ci --help

      - name: Check no credentials were baked in
        # .dockerignore excludes .env, and a layer keeps whatever it was given
        # even if a later step deletes it. Cheap to assert, expensive to miss.
        run: |
          if docker run --rm --entrypoint sh "amara-${{ inputs.component }}:ci" \
               -c 'ls -a /app' | grep -qE '^\.env'; then
            echo "::error::a .env file is present in amara-${{ inputs.component }}"
            exit 1
          fi
          echo "no .env in the image"
