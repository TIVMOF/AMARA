# The release recipe, called by release-{get,cut,sew}.yaml. This is the only
# workflow that publishes: it builds the stage's image and pushes it to the
# GitHub Container Registry as ghcr.io/<owner>/amara-<stage>.
name: Release image

on:
  workflow_call:
    inputs:
      component:
        description: Which stage to release - get, cut or sew.
        required: true
        type: string
      version:
        description: The version to publish, e.g. 1.2.0.
        required: true
        type: string
      latest:
        description: Also move the :latest tag to this version.
        required: false
        default: true
        type: boolean

jobs:
  release:
    name: publish amara-${{ inputs.component }} ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Writing to the registry is the whole point, and it is the only extra
      # permission this needs. GITHUB_TOKEN covers it - no PAT, no secret.
      packages: write

    steps:
      - name: Check the version looks like one
        # A typo here becomes a published tag, and published tags are awkward
        # to take back. Digits and dots, optionally a pre-release suffix.
        run: |
          version='${{ inputs.version }}'
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a version like 1.2.0 or 1.2.0-rc.1"
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Work out the image name and tags
        # GHCR rejects an upper-case path, and this repository's owner is
        # TIVMOF - so github.repository_owner cannot be used as it comes.
        #
        # The tag list is built here rather than in the `tags:` input below,
        # so that skipping :latest omits the line instead of leaving an empty
        # one for the action to interpret.
        run: |
          # tr rather than bash's ${x,,}: the latter is bash 4+, and this is
          # the one line that decides whether the push lands at all.
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/amara-${{ inputs.component }}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          {
            echo "TAGS<<__EOF__"
            echo "$image:${{ inputs.version }}"
            if [ "${{ inputs.latest }}" = "true" ]; then
              echo "$image:latest"
            fi
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ env.IMAGE }}
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ inputs.component }}
          push: true
          tags: ${{ env.TAGS }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.component }}

      - name: Summary
        run: |
          {
            echo "### Published \`amara-${{ inputs.component }}\`"
            echo
            echo "| tag | |"
            echo "|---|---|"
            echo "| \`${{ env.IMAGE }}:${{ inputs.version }}\` | pushed |"
            echo "| \`${{ env.IMAGE }}:latest\` | ${{ inputs.latest && 'moved' || 'left alone' }} |"
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\`"
            echo
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ inputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
