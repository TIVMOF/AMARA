name: release cut

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.0'
        required: true
        type: string
      latest:
        description: 'Also move the :latest tag'
        required: false
        default: true
        type: boolean

# One release of a stage at a time, and never cancelled halfway.
concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  release:
    name: publish amara-cut ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-image
        with:
          component: cut
          version: ${{ inputs.version }}
          latest: ${{ inputs.latest }}
          token: ${{ secrets.GITHUB_TOKEN }}
