# Publishes ghcr.io/tivmof/amara-cut. Run by hand from the Actions tab:
# pick a branch or tag, type the version, and it builds and pushes.
name: release cut

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.0'
        required: true
        type: string
      latest:
        description: 'Also move the :latest tag'
        required: false
        default: true
        type: boolean

# One release of a stage at a time, and never cancelled halfway.
concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  release:
    name: publish amara-cut ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Writing to the registry is the whole point, and the only extra
      # permission needed. A composite action cannot declare this itself,
      # so it is granted here. GITHUB_TOKEN covers it - no PAT, no secret.
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/release-image
        with:
          component: cut
          version: ${{ inputs.version }}
          latest: ${{ inputs.latest }}
          # A composite action cannot read the secrets context, so it is
          # handed the token rather than reaching for it.
          token: ${{ secrets.GITHUB_TOKEN }}
