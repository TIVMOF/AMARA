# Publishes ghcr.io/tivmof/amara-cut. Run by hand from the Actions tab:
# pick a branch or tag, type the version, and it builds and pushes.
name: release cut

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.0'
        required: true
        type: string
      latest:
        description: 'Also move the :latest tag'
        required: false
        default: true
        type: boolean

# One release of a stage at a time, and never cancelled halfway.
concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/composite-actions/release-image.yaml
    with:
      component: cut
      version: ${{ inputs.version }}
      latest: ${{ inputs.latest }}
