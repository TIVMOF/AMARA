# sneakers + streetwear
# Discovered by: python ingestion.py probe renarts.com
name: renarts
adapter: shopify
base_url: https://www.renarts.com

currency: "USD"
country: "US"

# Empty = whole catalogue. Add Shopify collection handles to narrow the crawl,
# e.g. [clothing, shoes, bags, accessories] - check /collections.json for names.
# `python ingestion.py collections renarts` lists these, largest first.
collections: []

# Permission only; renarts will not use it. Its unfiltered /products.json
# serves the whole catalogue - 1,975 products over 9 pages - and page 1 of its
# largest collection holds nothing that listing missed. The 249 this file used
# to claim was the short-page bug in #1 reading a 241-item page 2 as the end of
# the store. See issues #1 and #16.
discover_collections: true
max_collections: 15

# Stop after N pages per collection. null = until the store runs out.
max_pages: null

enabled: true
notes: "multi-brand retailer"
