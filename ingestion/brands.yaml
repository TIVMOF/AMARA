# Brand allowlist. A product is kept only if its vendor matches something here.
#
# Each brand sits on three independent axes:
#
#     Yohji Yamamoto   segment=Designer     tier=Luxury      style=Avant-Garde
#     Nike             segment=Sportswear   tier=Premium     style=Performance
#     Zara             segment=High Street  tier=Mainstream  style=Casual
#
#   segment  what market the brand plays in
#   tier     where it sits on price and prestige
#   styles   what it looks like - a list, since brands rarely sit in just one
#
# What a brand *makes* is deliberately not an axis. That Church's sells shoes
# and Serapian sells bags is a fact about the product, and lives in the
# product's `category` field - not here.
#
# Brands are grouped by shared (segment, tier, styles) to keep the file short.
# A brand listed in more than one group keeps the FIRST, so order matters.
# Every value below is checked against these vocabularies at load time.
#
# Matching folds case, accents and punctuation, so "ACNE STUDIOS", "Acne
# Studios", "ALAIA" and "Alaïa" all hit. Different words and sub-labels need an
# entry under `aliases` at the bottom.
#
# Dropped vendors are reported at the end of every crawl. That report is how
# this file grows.

segments:
  - Luxury House          # established maisons
  - Designer              # runway and designer labels
  - Contemporary Designer # accessible designer / lifestyle labels
  - Streetwear
  - Sportswear
  - Outdoor
  - Casual            # premium-to-mainstream everyday wear
  - High Street
  - Denim
  - Basics            # underwear, loungewear, foundations

tiers:
  - High Luxury
  - Luxury
  - Premium
  - Mainstream

# A brand can carry more than one style - `styles` is a list.
styles:
  - Avant-Garde
  - Contemporary
  - Lifestyle
  - Occasion
  - Minimalist
  - Classic
  - Glamour
  - Feminine
  - Casual
  - Street
  - Performance
  - Technical
  - Heritage


