# sneakers + streetwear
# Discovered by: python -m scripts probe renarts.com
name: renarts
adapter: shopify
base_url: https://www.renarts.com

currency: "USD"
country: "US"
rate_limit_rps: 0.5

# Empty = whole catalogue. Add Shopify collection handles to narrow the crawl,
# e.g. [clothing, shoes, bags, accessories] - check /collections.json for names.
collections: []

# Stop after N pages per collection. null = until the store runs out.
max_pages: null

enabled: true
notes: "multi-brand retailer"
