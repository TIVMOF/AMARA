# Brands AMARA keeps. A product whose vendor is not listed here is dropped, so
# this file is the allowlist as well as the classification.
#
# To add a brand, add one entry anywhere. Nothing is grouped and order does not
# matter:
#
#   Acne Studios:
#     segment: Contemporary Designer
#     tier: Premium
#     aliases: [Acne]          # optional: other spellings a store uses
#
# `segment` and `tier` must appear in the vocabularies below - a typo fails at
# load rather than inventing a value. Matching folds case, accents and
# punctuation, so ACNE STUDIOS and Acne Studios need no alias between them.
#
# `styles` is carried through from the earlier grouped file. Nothing reads it
# yet; it is what style_to_brand in the model will be built from.

segments:
  - Luxury House
  - Designer
  - Contemporary Designer
  - Streetwear
  - Sportswear
  - Outdoor
  - Casual
  - High Street
  - Denim
  - Basics


tiers:
  - High Luxury
  - Luxury
  - Premium
  - Mainstream


styles:
  - Avant-Garde
  - Contemporary
  - Lifestyle
  - Occasion
  - Minimalist
  - Classic
  - Glamour
  - Feminine
  - Casual
  - Street
  - Performance
  - Technical
  - Heritage


